# tmux: https://github.com/tmux/tmux/wiki
# Reload after editing: prefix + r
#
# No plugins: everything is plain tmux. Colors are terminal color names
# (blue, green, black, ...), so tmux follows the active dotfiles theme.
# Icons are Nerd Font code points written as escapes (\ue0b6 etc.).


# --- Basics -----------------------------------------------------------------

# Prefix: Ctrl+B, tmux's default (press it twice to send Ctrl+B to the program).
set -g prefix C-b
bind C-b send-prefix

set -g mouse on
set -g base-index 1            # windows start at 1, matching the keyboard
setw -g pane-base-index 1
set -g renumber-windows on     # no gaps after closing a window
set -g history-limit 50000
set -g escape-time 0           # no delay after Esc (important for Neovim)
set -g focus-events on
set -g set-clipboard on        # copying in tmux also copies to the system clipboard
set -g allow-passthrough on    # lets programs inside tmux show images, set titles, etc.

# True color and italics.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB"

# Window title of the terminal: session and current program.
set -g set-titles on
set -g set-titles-string "#S · #W"


# --- Keys -------------------------------------------------------------------

bind -N "Reload the tmux config" r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Splits open in the current folder. | and - show the direction of the split line.
bind -N "Split side by side (in the current folder)" | split-window -h -c "#{pane_current_path}"
bind -N "Split top and bottom (in the current folder)" - split-window -v -c "#{pane_current_path}"
bind -N "New window (in the current folder)" c new-window -c "#{pane_current_path}"

# Move between panes with h/j/k/l (Vim keys), resize with H/J/K/L (repeatable).
bind -N "Move to the pane on the left" h select-pane -L
bind -N "Move to the pane below" j select-pane -D
bind -N "Move to the pane above" k select-pane -U
bind -N "Move to the pane on the right" l select-pane -R
bind -N "Make the pane wider to the left (repeatable)" -r H resize-pane -L 5
bind -N "Make the pane taller downwards (repeatable)" -r J resize-pane -D 5
bind -N "Make the pane taller upwards (repeatable)" -r K resize-pane -U 5
bind -N "Make the pane wider to the right (repeatable)" -r L resize-pane -R 5

# Copy mode with Vim keys: prefix + [ to enter, v to select, y to copy.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Popups
bind -N "lazygit in a popup" g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind -N "Scratch shell in a popup" ` display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# fzf in popups gets --height=100%, overriding the shell's 40% so it fills the popup.

# Session picker: existing sessions, configured ones, and folders you visit often (zoxide).
bind -N "Session picker (sesh: sessions and frequent folders)" o display-popup -E -w 60% -h 60% "sesh connect \"$(sesh list --icons | fzf --height=100% --ansi --no-sort --border-label ' sessions ' --prompt '\uf489  ')\""

# workmux (git worktree per window, with an AI agent): dashboard and agent sidebar.
# Popups and run-shell have no $TMUX_PANE, which workmux needs to know which session gets a
# new worktree's window, so they get the pane they were opened from. display-popup does not
# fill in #{...} in its command, so run-shell (which does) opens the popup.
bind -N "workmux dashboard: agents and worktrees" W run-shell -b "tmux display-popup -c '#{client_name}' -d '#{session_path}' -E -w 95% -h 90% 'TMUX_PANE=#{pane_id} workmux dashboard'"
bind -N "workmux sidebar: agent status in every window" A run-shell "TMUX_PANE=#{pane_id} workmux sidebar"

# prefix + ? : search all prefix key bindings, filtering as you type.
bind -N "Search key bindings" ? display-popup -E -w 70% -h 70% "tmux list-keys -Na -T prefix | fzf --height=100% --no-sort --border-label ' key bindings ' --prompt 'prefix + '"


# --- Look -------------------------------------------------------------------
#
# Status bar at the top, transparent, with rounded "pills":
#
#    session          1 zsh   2 nvim   3 lazygit           Thu 30 Oct   14:05

set -g status-position top
set -g status-interval 5

# Two status lines: the pills, then an empty line as spacing above the panes.
set -g status 2
set -g status-format[1] ""
set -g status-style "bg=default,fg=white"
set -g status-justify absolute-centre
set -g status-left-length 40
set -g status-right-length 60

# Left: session name in a green pill.
set -g status-left "#[fg=green,bg=default]\ue0b6#[fg=black,bg=green,bold]\uf489 #S#[fg=green,bg=default,nobold]\ue0b4"

# Windows: the active one in a blue pill, others dimmed. After the name:
# the workmux agent status (working / waiting / done) and a magnifier when a pane is zoomed.
setw -g window-status-format "#[fg=brightblack] #I #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, \uf002,} "
setw -g window-status-current-format "#[fg=blue,bg=default]\ue0b6#[fg=black,bg=blue,bold]#I #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, \uf002,}#[fg=blue,bg=default,nobold]\ue0b4"
setw -g window-status-separator ""

# No underline or reverse video on window tabs (tmux's defaults); the pills are enough.
setw -g window-status-current-style "default"
setw -g window-status-activity-style "fg=yellow"
setw -g window-status-bell-style "fg=red"

# Right: a yellow PREFIX badge while the prefix is pressed, then date and time.
set -g status-right "#{?client_prefix,#[fg=yellow]\uf11c PREFIX  ,}#[fg=brightblack]%a %d %b  #[fg=cyan,bg=default]\ue0b6#[fg=black,bg=cyan]\uf017 %H:%M#[fg=cyan,bg=default]\ue0b4"

# Pane borders: thin lines between split panes, the active pane's border in blue.
# No title line on the borders: it only repeated what the window pills already show.
set -g pane-border-lines single
set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=blue"
set -g pane-border-status off
# With exactly two panes, tmux colors only half of the divider to show the active side;
# color the whole divider instead.
set -g pane-border-indicators off

# Messages, menus, popups and selections.
set -g message-style "fg=blue,bg=default,bold"
set -g mode-style "fg=black,bg=blue"
# Popups and menus use the terminal's background and text colors.
# (tmux 3.8's defaults use its own grey "theme" colors, which come out light grey.)
set -g popup-style "bg=default,fg=default"
set -g menu-style "bg=default,fg=default"
set -g menu-selected-style "fg=black,bg=blue"
set -g popup-border-lines rounded
set -g popup-border-style "fg=blue"
set -g menu-border-lines rounded
set -g menu-border-style "fg=blue"


# --- Plugins ----------------------------------------------------------------
#
# Managed by tpm (https://github.com/tmux-plugins/tpm), kept in ~/.config/tmux/plugins.
# `dotfiles install` installs missing plugins, `dotfiles upgrade` updates them.

set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"

set -g @plugin "tmux-plugins/tpm"

# Save sessions, windows and pane layouts every 15 minutes and restore them when
# tmux starts (e.g. after a reboot). Manual: prefix + Ctrl+S saves, prefix + Ctrl+R restores.
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @resurrect-dir "~/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

# Fuzzy-find sessions, windows, panes, commands and key bindings: prefix + F.
# Opens as a rounded popup, with the theme's fzf colors.
set -g @plugin "sainnhe/tmux-fzf"
set-environment -g TMUX_FZF_OPTIONS "-p -w 70% -h 60% -m --height=100% --border=rounded --border-label ' tmux '"
set-environment -g TMUX_FZF_ORDER "session|window|pane|command|keybinding"

# Must stay the last line.
run "~/.config/tmux/plugins/tpm/tpm"
