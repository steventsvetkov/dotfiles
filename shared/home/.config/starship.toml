"$schema" = "https://starship.rs/config-schema.json"

# Prompt layout:
#
#   ~/code/project  <git> main !1 ?2 +12 -3        <x> 1  <jobs> 2  took 3s  <node> 22.11  14:05
#   ❯
#
# Left: the host (over SSH only), the folder, git and the changed lines.
# Right: the last exit code, background jobs, sudo, how long the last command took,
# the project's language versions, and the time.
#
# Colors are terminal color names (blue, purple, ...), never hex codes,
# so the prompt follows the active dotfiles theme. Only the text is colored, no backgrounds.
#
# Icons are Nerd Font code points written as escapes (\ue725 etc.),
# because the glyphs themselves are invisible in editors without a Nerd Font.

add_newline = true

format = """
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
$status\
$jobs\
$sudo\
$cmd_duration\
$nodejs\
$python\
$golang\
$rust\
$time\
$line_break\
$character"""

[fill]
symbol = " "

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold yellow"

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " \U000f033e"

[git_branch]
symbol = "\ue725 "
format = "[$symbol$branch]($style) "
style = "purple"

[git_state]
style = "bold yellow"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"

# Lines added and removed in uncommitted changes.
[git_metrics]
disabled = false
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "green"
deleted_style = "red"

# The exit code of the last command, only when it failed.
[status]
disabled = false
symbol = "\uf00d "
format = "[$symbol$status]($style) "
style = "red"

[jobs]
symbol = "\uf013 "
number_threshold = 1
format = "[$symbol$number]($style) "
style = "blue"

# Shown while sudo still has your password cached.
[sudo]
disabled = false
symbol = "\uf0e7"
format = "[$symbol]($style) "
style = "yellow"

[cmd_duration]
min_time = 2000
format = "[\U000f0954 $duration]($style) "
style = "bright-black"

[nodejs]
symbol = "\ue718 "
format = "[$symbol$version]($style) "
style = "green"

[python]
symbol = "\ue73c "
format = "[$symbol$version( \\($virtualenv\\))]($style) "
style = "yellow"

[golang]
symbol = "\ue627 "
format = "[$symbol$version]($style) "
style = "cyan"

[rust]
symbol = "\U000f1617 "
format = "[$symbol$version]($style) "
style = "red"

[time]
disabled = false
time_format = "%H:%M"
format = "[\uf017 $time]($style)"
style = "bright-black"

[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
