# AeroSpace tiling window manager: https://nikitabobko.github.io/AeroSpace/guide
# Reload after editing: Cmd+Shift+; then Esc, or run `aerospace reload-config`.
#
# Shortcuts match Omarchy's, with Cmd as the Super key.
#
# How Cmd reaches AeroSpace: Karabiner turns Cmd+<key> into Ctrl+Alt+Cmd+<key>
# for the keys used below (see karabiner/karabiner.json, rule "Cmd is Super").
# AeroSpace only listens for Ctrl+Alt+Cmd, so it never clashes with the Cmd
# shortcuts that Karabiner sends to apps when you press Ctrl (Ctrl+W -> Cmd+W).

config-version = 2

start-at-login = true

# Workspaces 1-9 and 0 always exist, even when empty.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]

# Gaps between windows and around the screen edge.
gaps.inner.horizontal = 15
gaps.inner.vertical = 15
gaps.outer.left = 15
gaps.outer.right = 15
# Top: leave room for SketchyBar plus a gap.
# On the MacBook screen, macOS already keeps the notch strip (where the bar is) out of
# the usable area, so only the gap is needed there: 15, like the sides. External monitors
# have no notch, so they need the bar's full height: it matches the MacBook's notch
# (45 at the current resolution, see sketchybar/helpers/bar_height.sh) + 10.
gaps.outer.top = [{ monitor."Built-in" = 15 }, 54]
gaps.outer.bottom = 15

# Moving focus to another monitor also moves the mouse there.
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]

# SketchyBar (the menu bar replacement): start it with AeroSpace, and tell it when
# the workspace or the focused window changes so it can update the workspace list.
after-startup-command = ["exec-and-forget sketchybar"]
exec-on-workspace-change = [
  "/bin/bash", "-c",
  "sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE",
]
on-focus-changed = ["exec-and-forget sketchybar --trigger aerospace_focus_change"]


# With an external monitor: 1-5 on the external monitor, 6-0 on the MacBook screen.
# With only the MacBook screen, all of them are on it. "^(?!built-in)" matches any monitor
# whose name does not start with "Built-in" (patterns are case-insensitive regexes); when
# there is none, the next pattern, "built-in", is used.
[workspace-to-monitor-force-assignment]
1 = ["^(?!built-in)", "built-in"]
2 = ["^(?!built-in)", "built-in"]
3 = ["^(?!built-in)", "built-in"]
4 = ["^(?!built-in)", "built-in"]
5 = ["^(?!built-in)", "built-in"]
6 = "built-in"
7 = "built-in"
8 = "built-in"
9 = "built-in"
0 = "built-in"

[mode.main.binding]

# Workspaces: Cmd+1-9/0 to go there, Cmd+Shift+1-9/0 to move the window there (and follow it).
ctrl-alt-cmd-1 = "workspace 1"
ctrl-alt-cmd-2 = "workspace 2"
ctrl-alt-cmd-3 = "workspace 3"
ctrl-alt-cmd-4 = "workspace 4"
ctrl-alt-cmd-5 = "workspace 5"
ctrl-alt-cmd-6 = "workspace 6"
ctrl-alt-cmd-7 = "workspace 7"
ctrl-alt-cmd-8 = "workspace 8"
ctrl-alt-cmd-9 = "workspace 9"
ctrl-alt-cmd-0 = "workspace 0"

ctrl-alt-cmd-shift-1 = "move-node-to-workspace 1 --focus-follows-window"
ctrl-alt-cmd-shift-2 = "move-node-to-workspace 2 --focus-follows-window"
ctrl-alt-cmd-shift-3 = "move-node-to-workspace 3 --focus-follows-window"
ctrl-alt-cmd-shift-4 = "move-node-to-workspace 4 --focus-follows-window"
ctrl-alt-cmd-shift-5 = "move-node-to-workspace 5 --focus-follows-window"
ctrl-alt-cmd-shift-6 = "move-node-to-workspace 6 --focus-follows-window"
ctrl-alt-cmd-shift-7 = "move-node-to-workspace 7 --focus-follows-window"
ctrl-alt-cmd-shift-8 = "move-node-to-workspace 8 --focus-follows-window"
ctrl-alt-cmd-shift-9 = "move-node-to-workspace 9 --focus-follows-window"
ctrl-alt-cmd-shift-0 = "move-node-to-workspace 0 --focus-follows-window"

# Focus: Cmd+arrows. Move the window: Cmd+Shift+arrows.
ctrl-alt-cmd-left = "focus left"
ctrl-alt-cmd-down = "focus down"
ctrl-alt-cmd-up = "focus up"
ctrl-alt-cmd-right = "focus right"

ctrl-alt-cmd-shift-left = "move left"
ctrl-alt-cmd-shift-down = "move down"
ctrl-alt-cmd-shift-up = "move up"
ctrl-alt-cmd-shift-right = "move right"

# Windows
ctrl-alt-cmd-w = "close"                                  # Cmd+W  close window
ctrl-alt-cmd-f = "fullscreen"                             # Cmd+F  fullscreen
ctrl-alt-cmd-t = "layout floating tiling"                 # Cmd+T  float / tile
ctrl-alt-cmd-j = "layout tiles horizontal vertical"       # Cmd+J  switch split direction
ctrl-alt-cmd-equal = "resize smart +50"                   # Cmd+=  grow
ctrl-alt-cmd-minus = "resize smart -50"                   # Cmd+-  shrink

# Cmd+Return: bring Ghostty to the front, or start it.
# (Ghostty on macOS cannot open a window from the command line; use Cmd+N inside it.)
ctrl-alt-cmd-enter = "exec-and-forget open -a Ghostty"

# Cmd+Shift+; : prefix mode, for the rarely used commands below.
# (Every mode change also tells SketchyBar, which shows the mode while it is not "main".)
ctrl-alt-cmd-shift-semicolon = ["mode prefix", "exec-and-forget sketchybar --trigger aerospace_mode_change MODE=prefix"]


[mode.prefix.binding]
# Each binding ends by going back to main mode and telling SketchyBar.
esc = ["reload-config", "mode main", "exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main"]                      # reload this file
r = ["flatten-workspace-tree", "mode main", "exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main"]               # reset the layout
backspace = ["close-all-windows-but-current", "mode main", "exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main"]


# Apps that should float instead of being tiled.
[[on-window-detected]]
if = "test %{app-bundle-id} = com.apple.systempreferences"
run = "layout floating"

[[on-window-detected]]
if = "test %{app-bundle-id} = com.apple.calculator"
run = "layout floating"

[[on-window-detected]]
if = "test %{app-bundle-id} = org.pqrs.Karabiner-Elements.Settings"
run = "layout floating"

[[on-window-detected]]
if = "test %{app-bundle-id} = pro.betterdisplay.BetterDisplay"
run = "layout floating"

[[on-window-detected]]
if = "test %{app-bundle-id} = us.zoom.xos"
run = "layout floating"
